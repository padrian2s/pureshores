<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('15_26_37.png') center center / cover no-repeat;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .title-container {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            text-shadow: 0 0 40px rgba(126, 200, 227, 0.5);
        }

        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #b8e4f0, #7ec8e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 2rem);
            font-weight: 200;
            letter-spacing: 0.2em;
            opacity: 0.9;
        }

        .wave-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, rgba(126, 200, 227, 0.15), transparent);
        }

        .about-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            pointer-events: auto;
        }

        .about-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .about-link:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(126, 200, 227, 0.2);
        }

        .about-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(126, 200, 227, 0.4), rgba(184, 228, 240, 0.6));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .nav-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .nav-toggle {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            pointer-events: auto;
            z-index: 1002;
        }

        .nav-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .nav-toggle-icon {
            width: 20px;
            height: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .nav-toggle-icon span {
            display: block;
            width: 100%;
            height: 2px;
            background: currentColor;
            border-radius: 1px;
            transition: all 0.3s ease;
        }

        .nav-container.open .nav-toggle-icon span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .nav-container.open .nav-toggle-icon span:nth-child(2) {
            opacity: 0;
        }

        .nav-container.open .nav-toggle-icon span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .nav-container.open .nav-overlay {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .nav-content,
        .alphabet-rail {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease 0.1s, visibility 0.4s ease 0.1s;
            pointer-events: none;
        }

        .nav-container.open .nav-content,
        .nav-container.open .alphabet-rail {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Alphabet navigation */
        .nav-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 40px;
            bottom: 0;
            overflow-y: auto;
            padding: 90px 20px 40px 20px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .nav-content::-webkit-scrollbar {
            display: none;
        }

        .letter-group {
            margin-bottom: 10px;
        }

        .letter-header {
            font-size: 1.4rem;
            font-weight: 600;
            color: rgba(126, 200, 227, 0.9);
            padding: 12px 20px 8px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .letter-group .app-link {
            display: block;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 12px 30px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 8px;
        }

        .letter-group .app-link:hover {
            background: rgba(126, 200, 227, 0.2);
            border-color: rgba(126, 200, 227, 0.4);
            color: rgba(126, 200, 227, 1);
            text-shadow: 0 0 20px rgba(126, 200, 227, 0.6);
            transform: translateX(4px);
        }

        .letter-group .app-link .link-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: rgba(126, 200, 227, 0.8);
            border-radius: 50%;
            margin-right: 12px;
            vertical-align: middle;
            transition: all 0.3s ease;
        }

        .letter-group .app-link:hover .link-dot {
            background: rgba(126, 200, 227, 1);
            box-shadow: 0 0 12px rgba(126, 200, 227, 1);
        }

        /* Alphabet rail */
        .alphabet-rail {
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1002;
            padding: 10px 0;
            user-select: none;
        }

        .alphabet-rail .letter {
            font-size: 0.6rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            padding: 2px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            position: relative;
            letter-spacing: 0;
        }

        .alphabet-rail .letter:hover {
            color: rgba(126, 200, 227, 1);
        }

        .alphabet-rail .letter.has-apps {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .alphabet-rail .letter.active {
            color: white;
            background: rgba(126, 200, 227, 0.9);
            font-weight: 700;
            font-size: 0.7rem;
            box-shadow: 0 0 15px rgba(126, 200, 227, 0.5);
        }

        .alphabet-rail .letter.disabled {
            color: rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .nav-toggle {
                top: 20px;
                left: 20px;
                padding: 16px 22px;
                background: rgba(0, 0, 0, 0.7);
                border: 2px solid rgba(255, 255, 255, 0.5);
                font-size: 1rem;
                font-weight: 500;
                color: white;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }

            .nav-container.open .nav-toggle {
                background: rgba(0, 0, 0, 0.9);
                border-color: rgba(126, 200, 227, 0.8);
            }

            .nav-toggle-icon {
                width: 28px;
                height: 20px;
            }

            .nav-toggle-icon span {
                height: 3px;
                background: white;
            }


            .nav-content {
                right: 32px;
                padding: 90px 10px 40px 10px;
            }

            .alphabet-rail {
                width: 32px;
            }

            .alphabet-rail .letter {
                font-size: 0.55rem;
                width: 24px;
                height: 24px;
            }

            .alphabet-rail .letter.active {
                font-size: 0.6rem;
            }

            .letter-group .app-link {
                font-size: 1.2rem !important;
                padding: 16px 20px;
                min-width: 100%;
                background: rgba(255, 255, 255, 0.08);
                border: 2px solid rgba(255, 255, 255, 0.2);
                font-weight: 500;
            }

            .letter-group .app-link:active {
                background: rgba(126, 200, 227, 0.3);
                transform: scale(0.96);
            }

            .title-container {
                display: none;
            }

            .about-container {
                bottom: 20px;
                right: 20px;
            }

            .about-link {
                padding: 16px 24px;
                font-size: 1.1rem;
                background: rgba(0, 0, 0, 0.7);
                border: 2px solid rgba(255, 255, 255, 0.5);
                font-weight: 500;
                color: white;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }
        }
    </style>
</head>
<body>
<div class="canvas-container">

</div>

<div class="overlay">

        <div class="alphabet-rail" id="alphabetRail"></div>

</div>

<script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Particle system for ocean effect
    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.radius = Math.random() * 2 + 1;
            this.opacity = Math.random() * 0.5 + 0.2;
            this.hue = Math.random() * 30 + 185; // Cyan range matching image
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0 || this.x > canvas.width ||
                this.y < 0 || this.y > canvas.height) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity})`;
            ctx.fill();
        }
    }

    // Create particles
    const particleCount = 200;
    const particles = [];
    for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
    }

    // Wave animation
    let time = 0;

    function drawWaves() {
        const waveCount = 5;
        const amplitude = 80;

        for (let w = 0; w < waveCount; w++) {
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);

            const waveHeight = canvas.height * 0.6 + w * 40;
            const opacity = 0.1 - w * 0.015;

            for (let x = 0; x <= canvas.width; x += 5) {
                const y = waveHeight +
                    Math.sin((x * 0.003) + (time * 0.001) + (w * 0.5)) * amplitude +
                    Math.sin((x * 0.005) + (time * 0.002) + (w * 0.3)) * (amplitude * 0.5);
                ctx.lineTo(x, y);
            }

            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();

            const gradient = ctx.createLinearGradient(0, waveHeight - amplitude, 0, canvas.height);
            gradient.addColorStop(0, `rgba(126, 200, 227, ${opacity})`);
            gradient.addColorStop(1, `rgba(184, 228, 240, ${opacity * 1.5})`);

            ctx.fillStyle = gradient;
            ctx.fill();
        }
    }

    // Render glow effect
    function drawGlow() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const maxRadius = Math.max(canvas.width, canvas.height);

        const gradient = ctx.createRadialGradient(
            centerX, centerY, 0,
            centerX, centerY, maxRadius
        );

        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
        gradient.addColorStop(0.3, 'rgba(126, 200, 227, 0.04)');
        gradient.addColorStop(0.6, 'rgba(184, 228, 240, 0.02)');
        gradient.addColorStop(1, 'rgba(126, 200, 227, 0)');

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Animation loop
    function animate() {
        // Clear canvas to show background image
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw effects
        drawGlow();
        drawWaves();

        // Update and draw particles
        particles.forEach(particle => {
            particle.update();
            particle.draw();
        });

        // Draw connections between close particles
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 100) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(126, 200, 227, ${0.1 * (1 - distance / 100)})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }

        time++;
        requestAnimationFrame(animate);
    }

    animate();

    // Mouse interaction
    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;

    canvas.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        particles.forEach(particle => {
            const dx = mouseX - particle.x;
            const dy = mouseY - particle.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 150) {
                const force = (150 - distance) / 150;
                particle.vx -= (dx / distance) * force * 0.2;
                particle.vy -= (dy / distance) * force * 0.2;
            }
        });
    });

    // Nav toggle functionality
    const navToggle = document.getElementById('navToggle');
    const navContainer = document.getElementById('navContainer');
    const navOverlay = navContainer.querySelector('.nav-overlay');
    const navContent = document.getElementById('navContent');
    const alphabetRail = document.getElementById('alphabetRail');

    navToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        navContainer.classList.toggle('open');
    });

    // Close menu when clicking overlay
    navOverlay.addEventListener('click', () => {
        navContainer.classList.remove('open');
    });

    // Close menu when clicking any app link
    navContent.querySelectorAll('.app-link').forEach(link => {
        link.addEventListener('click', () => {
            navContainer.classList.remove('open');
        });
    });

    // Build alphabet rail
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const letterGroups = navContent.querySelectorAll('.letter-group');
    const activeLetters = new Set();
    letterGroups.forEach(g => activeLetters.add(g.dataset.letter));

    alphabet.split('').forEach(letter => {
        const el = document.createElement('div');
        el.className = 'letter';
        el.textContent = letter;
        if (activeLetters.has(letter)) {
            el.classList.add('has-apps');
        } else {
            el.classList.add('disabled');
        }
        el.dataset.letter = letter;
        el.addEventListener('click', () => {
            const group = navContent.querySelector(`.letter-group[data-letter="${letter}"]`);
            if (group) {
                group.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
        alphabetRail.appendChild(el);
    });

    // Scroll sync: update active letter in rail based on scroll position
    function updateActiveLetter() {
        const scrollTop = navContent.scrollTop;
        const contentTop = navContent.getBoundingClientRect().top;
        let currentLetter = null;

        letterGroups.forEach(group => {
            const rect = group.getBoundingClientRect();
            const groupTop = rect.top - contentTop;
            if (groupTop <= 80) {
                currentLetter = group.dataset.letter;
            }
        });

        if (!currentLetter && letterGroups.length > 0) {
            currentLetter = letterGroups[0].dataset.letter;
        }

        alphabetRail.querySelectorAll('.letter').forEach(el => {
            el.classList.toggle('active', el.dataset.letter === currentLetter);
        });
    }

    navContent.addEventListener('scroll', updateActiveLetter);

    // Set initial active letter when menu opens
    const observer = new MutationObserver(() => {
        if (navContainer.classList.contains('open')) {
            requestAnimationFrame(updateActiveLetter);
        }
    });
    observer.observe(navContainer, { attributes: true, attributeFilter: ['class'] });

    // Touch drag on alphabet rail for mobile
    function getLetterFromTouch(e) {
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.classList.contains('letter') && el.classList.contains('has-apps')) {
            return el.dataset.letter;
        }
        return null;
    }

    alphabetRail.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const letter = getLetterFromTouch(e);
        if (letter) {
            const group = navContent.querySelector(`.letter-group[data-letter="${letter}"]`);
            if (group) group.scrollIntoView({ behavior: 'auto', block: 'start' });
        }
    }, { passive: false });

    alphabetRail.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const letter = getLetterFromTouch(e);
        if (letter) {
            const group = navContent.querySelector(`.letter-group[data-letter="${letter}"]`);
            if (group) group.scrollIntoView({ behavior: 'auto', block: 'start' });
        }
    }, { passive: false });

</script>
</body>
</html>
